<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Actor Production Tracker</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <header class="masthead">
      <div><p class="eyebrow">LOCAL · READ ONLY · PRODUCTION DESK</p><h1>Actor Production Tracker</h1><p>파일 스캔으로 만든 제작 작업대 · 패키지 완료도는 이행 진행률이며, 기존 자산 부재 판정이 아닙니다.</p></div>
      <aside class="refresh"><strong>스캔 리비전 <span id="revision">—</span></strong><span>최신화: <code>Open Actor Production Tracker.command</code> 더블클릭</span></aside>
    </header>
    <nav class="views" aria-label="보기 전환">
      <button data-view="recommend" aria-pressed="true">작업 추천</button><button data-view="stages">제작 단계</button><button data-view="all">전체 목록</button><button data-view="candidates">후보 뱅크</button><button data-view="parked">보류·테스트</button>
    </nav>
    <section id="recommendation" class="recommendation" aria-label="지금 진행하기 좋은 작업"></section>
    <section id="summary" class="summary" aria-label="요약"></section>
    <section id="stageOverview" class="stage-overview" aria-label="제작 단계 개요"></section>
    <section id="filters" class="controls" aria-label="전체 목록 필터" hidden>
      <label>검색 <input id="search" type="search" placeholder="이름, 경로, 누락 항목"></label><label>월드 <select id="world"><option value="">전체</option></select></label><label>유형 <select id="type"><option value="">전체</option></select></label><label>상태 <select id="life"><option value="">전체</option></select></label><label>프로필 <select id="profile"><option value="">전체</option></select></label><label>Import <select id="import"><option value="">전체</option></select></label><label>작업 공백 <select id="gap"><option value="">전체</option><option value="package">패키지 미완료</option><option value="animation">애니메이션 공백</option><option value="attackpool">공격 Tier 풀 공백</option><option value="enemymotion">몬스터 모션 점검 필요</option><option value="runtime">런타임 공백</option><option value="table">테이블 공백</option></select></label><button id="reset" class="quiet">필터 초기화</button>
    </section>
    <p id="count" class="count" aria-live="polite"></p>
    <section id="actors" class="actors" aria-label="배우 목록"></section>
  </main>
  <script src="../../ProjectDocs/ActorProduction/dashboard-data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
